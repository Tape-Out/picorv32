name: subs

on:
  schedule:
    # 半月一次，与 bump 同节奏、只错开时刻：上游往前走了子模块不会自己跟，
    # 不跟不会报错，只会让我们一直对着一份越来越旧的源码量面积、跑测试
    - cron: "23 4 1,16 * *"
  workflow_dispatch:

jobs:
  subs:
    uses: Tape-Out/.github/.github/workflows/subs.yml@main
    permissions:
      contents: write
      pull-requests: write
